[workspace]

[package]
name = "svault-dashboard"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "SecretsVault local dashboard (Tauri shell + secure broker connection, D1)"
license = "Apache-2.0"
publish = false
default-run = "svault-dashboard"

[[bin]]
name = "svault-dashboard"
path = "src/main.rs"

[lib]
name = "svault_dashboard_lib"
path = "src/lib.rs"

[dependencies]
svault = { path = ".." }
tauri = { version = "2", default-features = false, features = ["wry"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"

[build-dependencies]
tauri-build = { version = "2", features = [] }
