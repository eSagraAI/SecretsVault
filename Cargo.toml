[package]
name = "svault"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Local-first secrets and permissions broker for AI agents — Linux-first, harness-agnostic."
license = "Apache-2.0"
publish = false

[dependencies]
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
base64 = "0.22"
chacha20poly1305 = "0.10"
clap = { version = "4", features = ["derive"] }
getrandom = "0.2"
libc = "0.2"
hkdf = "0.12"
hmac = "0.12"
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
time = { version = "0.3", features = ["formatting", "serde-well-known"] }
zeroize = "1"
ed25519-dalek = { version = "3.0.0", features = ["zeroize"] }

[dev-dependencies]
dotenvy = "0.15"

# MCP adapter (src/mcp.rs) is synchronous stdio and adds no dependencies.

[workspace]
exclude = ["dashboard"]
